# The same static site GitHub Pages serves: files from dist/, nothing else.
root /usr/share/nginx/html;
index index.html;
gzip_static on;

location / {
    try_files $uri $uri/ =404;
}

# A new service worker or shell must reach returning visitors on their next load.
location = /sw.js {
    add_header Cache-Control "no-cache";
}
location = /index.html {
    add_header Cache-Control "no-cache";
}
