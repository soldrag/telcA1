services:
  telc-a1-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        COMMIT_SHA: ${COMMIT_SHA:-unknown}
    container_name: telc-a1-app
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "8443:8443"
    volumes:
      # Optional: cert.pem and key.pem here turn on HTTPS on 8443 (see README).
      - ./certs:/etc/nginx/certs:ro
